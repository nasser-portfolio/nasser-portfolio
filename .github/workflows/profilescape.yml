name: Profilescape

# Renders the profile cards and keeps README.md up to date between the
# <!-- profilescape:start --> and <!-- profilescape:end --> markers.
# Card options (role, skills, LinkedIn) live in .github/profilescape.json.
# Every option: https://github.com/chethandvg/profilescape#inputs

on:
  schedule:
    - cron: "23 4 * * *" # every day at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profilescape
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: chethandvg/profilescape@v1
        with:
          cards: hero,socials,stats,3d,languages,repos,stack
          theme: gruvbox
          config: .github/profilescape.json
          readme: README.md
          # Optional: add a PROFILESCAPE_TOKEN secret to include private contributions.
          token: ${{ secrets.PROFILESCAPE_TOKEN || github.token }}
